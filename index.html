<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abraham Ahumada</title>
    <link rel="shortcut icon" href="portfolio/images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="portfolio/images/favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@master/devicon.min.css">

    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-color: #1f1f1f;
            --panel-color: #fffdfa;
            --panel-border: #dfd9cc;
            --accent-color: #2b6cb0;
            --accent-alt: #0f766e;
            --shadow-color: rgba(30, 41, 59, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #fffefa 0%, var(--bg-color) 58%, #ece6d7 100%);
            color: var(--text-color);
            font-family: "Manrope", sans-serif;
            padding: 24px;
        }

        .landing {
            width: min(760px, 100%);
            text-align: center;
            background-color: var(--panel-color);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 42px 28px;
            box-shadow: 0 24px 54px var(--shadow-color);
        }

        .title {
            margin: 0 0 10px 0;
            font-family: "DM Serif Display", serif;
            font-weight: 400;
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin: 0 0 28px 0;
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            color: #5b5b5b;
        }

        .link-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .link-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ffffff;
            font-family: "Manrope", sans-serif;
            font-weight: 700;
            padding: 12px 18px;
            border-radius: 12px;
            transition: transform 120ms ease, filter 120ms ease;
        }

        .link-pill:hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }

        .link-pill:focus-visible {
            outline: 3px solid #111111;
            outline-offset: 2px;
        }

        .link-portfolio {
            background: linear-gradient(135deg, var(--accent-color), #435edb);
        }

        .link-linkedin {
            background: linear-gradient(135deg, var(--accent-alt), #35884e);
        }

        .icon-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: clamp(1.75rem, 4vw, 2.2rem);
        }

        .icon-row i {
            color: #2d3748;
            filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.18));
        }

        @media (max-width: 480px) {
            .landing {
                padding: 34px 18px;
                border-radius: 18px;
            }

            .link-pill {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <main class="landing">
        <h1 class="title">Abraham Ahumada</h1>
        <p class="subtitle">Game Developer and Software Engineer</p>

        <nav class="link-row" aria-label="Main links">
            <a class="link-pill link-portfolio" href="portfolio/index.html">
                <i class="devicon-unity-plain"></i>
                Portfolio
            </a>
            <a class="link-pill link-linkedin" href="https://www.linkedin.com/in/abraham-ahumada/" target="_blank" rel="noopener noreferrer">
                <i class="devicon-linkedin-plain"></i>
                LinkedIn
            </a>
        </nav>

        <section class="icon-row" aria-label="Developer tools and languages">
            <i class="devicon-csharp-plain" title="C#"></i>
            <i class="devicon-cplusplus-plain" title="C++"></i>
            <i class="devicon-javascript-plain" title="JavaScript"></i>
        </section>
    </main>
</body>

</html>
